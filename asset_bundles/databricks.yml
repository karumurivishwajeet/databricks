bundle:
  name: asset_bundles
  uuid: d12129e1-f9f2-4d86-adbd-1ac4c32b82a2

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.


targets:
  dev:
    mode: development
    default: true
    workspace:
      host: dbc-20b9f460-f29a.cloud.databricks.com
    permissions:
      - user_name: vishwajeetkarumuri@gmail.com
        level: CAN_MANAGE
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false

  prod:
    mode: production
    workspace:
      host: dbc-20b9f460-f29a.cloud.databricks.com
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: vishwajeetkarumuri@gmail.com
        level: CAN_MANAGE
      - group_name: admins
        level: CAN_RUN
